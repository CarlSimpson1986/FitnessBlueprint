# Supabase local development config.
# Run `supabase init` if this needs regenerating — this is a minimal
# starting point, not a full reference.

project_id = "fitness-blueprint"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Members sign in via magic link or email/password — no third-party
# OAuth needed for a single-gym app. Site URL must match production
# once deployed, or auth redirects will silently fail.
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://fitnessblueprint.co.uk"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Branded auth emails (2026-09-25). The hosted project's copies live in the
# Supabase dashboard (Authentication -> Emails); these files are the source
# of truth — paste from here when changing them. Links must stay
# {{ .ConfirmationURL }}: it routes through /auth/callback (PKCE code flow).
[auth.email.template.confirmation]
subject = "Confirm your email for Fitness Blueprint"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Fitness Blueprint sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your Fitness Blueprint password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Fitness Blueprint"
content_path = "./supabase/templates/email_change.html"
